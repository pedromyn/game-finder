spring.application.name=gamematch-api
server.port=8080

# H2 em arquivo: os dados continuam salvos entre execucoes (pasta backend/data).
spring.datasource.url=jdbc:h2:file:./data/gamematch
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Inclui a mensagem de erro no JSON das respostas 4xx (o app mostra ao usuario).
server.error.include-message=always
